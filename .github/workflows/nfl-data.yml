name: NFL data refresh

# Keeps the NFL board's public data current: the week's schedule and scores and the finished
# games' box scores from ESPN (anonymous, throttled to one call per 15 minutes), and the
# PropFinder pull for the week (with the site token).
# The server runs these jobs on time itself (lib/scheduler.js, lib/schedule-jobs.js: the same calls at the same
# Eastern times); this workflow is the backstop. A scheduled run names its job from the cron that fired it and
# passes `job=<id>`, so the site skips a slot the server already ran (GitHub fires schedules hours late: the
# 9:33 AM run went at 3:10 PM on 2026-10-29). A manual run (workflow_dispatch) always runs.
on:
  schedule:
    - cron: '33 13 * * *'      # ~9:33 ET daily: the week's schedule, yesterday's box scores, the PropFinder pull
    - cron: '41 4 * * 1,2,5'   # ~00:41 ET Mon / Tue / Fri: Sunday, Monday and Thursday night finals
  workflow_dispatch:
    inputs:
      date:
        description: 'A date in the week to refresh (YYYY-MM-DD, ET). Blank = today.'
        required: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refresh
        env:
          NHL_ACTIONS_TOKEN: ${{ secrets.NHL_ACTIONS_TOKEN }}
        run: |
          set -e
          DATE="${{ github.event.inputs.date }}"
          [ -z "$DATE" ] && DATE=$(TZ=America/New_York date +%F)
          # The job from the cron that fired (not the hour it ran: a late run of the 00:41 slot is still the late run).
          JOB=""; case "${{ github.event.schedule }}" in '33 13 * * *') JOB=nfl-morning ;; '41 4 * * 1,2,5') JOB=nfl-late ;; esac
          J=""; [ -n "$JOB" ] && J="&job=$JOB"
          if [ "$JOB" = "nfl-late" ] && [ -z "${{ github.event.inputs.date }}" ]; then DATE=$(TZ=America/New_York date -d 'yesterday' +%F); fi
          FORCE=""; [ "${{ github.event_name }}" = "workflow_dispatch" ] && FORCE="&force=1"
          echo "Refreshing the NFL week of $DATE"
          call() { local c; for attempt in 1 2; do c=$(curl -sS -o "$2" -w '%{http_code}' -X POST --max-time 280 ${NHL_ACTIONS_TOKEN:+-H "Authorization: Bearer $NHL_ACTIONS_TOKEN"} "$1" || true); [ -n "$c" ] || c=000; case "$c" in 5*|000) [ "$attempt" = 1 ] && { echo "server answered $c; retrying in 60 s" >&2; sleep 60; } ;; *) break ;; esac; done; echo "$c"; }
          code=$(call "https://ideareels.io/api/nfl/refresh?date=$DATE&only=schedule$J" sched.json); echo "schedule: $code $(head -c 600 sched.json)"
          [ "$code" = "200" ] || [ "$code" = "429" ]
          if [ -n "$NHL_ACTIONS_TOKEN" ] && [ "$JOB" != "nfl-late" ]; then
            pf=$(call "https://ideareels.io/api/nfl/refresh?date=$DATE&only=propfinder${FORCE}$J" pf.json); echo "propfinder: $pf $(head -c 3000 pf.json)"
            # The rest of the pull's report in full (the 16 KB head cut it off before the markets): the odds markets with the
            # one each was filed under (null = skipped), the team rows' type / position / season / window, the samples.
            jq -c '.propfinder | {players, withProps, withGames, defenseTeams, depthCharts, depthFrom, extra}' pf.json 2>/dev/null || true
            jq -c '.propfinder.fieldsSeen | {unread, stored, player, prop}' pf.json 2>/dev/null || true
            jq -r '.propfinder.fieldsSeen.markets // {} | to_entries | sort_by(-.value.n) | .[] | "market \(.value.n)\t\(.value.market // "SKIPPED")\t\(.key)"' pf.json 2>/dev/null || true
            jq -r '.propfinder.fieldsSeen.sample | to_entries[] | "sample \(.key): \(.value | tostring | .[0:4000])"' pf.json 2>/dev/null || true
            # The cheat-sheet pages the pull keeps (lib/nfl/propfinder-nfl.js pages): each one's answer, keys and first characters.
            jq -r '.propfinder.samples // {} | to_entries[] | "page \(.key): \(.value.error // "ok") keys \(.value.keys | join(",")) \(.value.sample // "" | .[0:6000])"' pf.json 2>/dev/null || true
          fi
