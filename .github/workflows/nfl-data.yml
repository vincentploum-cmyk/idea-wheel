name: NFL data refresh

# Keeps the NFL board's public data current: the week's schedule and scores and the finished
# games' box scores from ESPN (anonymous, throttled to one call per 15 minutes), and the
# PropFinder pull for the week (with the site token).
on:
  schedule:
    - cron: '33 13 * * *'      # ~9:33 ET daily: the week's schedule, yesterday's box scores, the PropFinder pull
    - cron: '41 4 * * 1,2,5'   # ~00:41 ET Mon / Tue / Fri: Sunday, Monday and Thursday night finals
  workflow_dispatch:
    inputs:
      date:
        description: 'A date in the week to refresh (YYYY-MM-DD, ET). Blank = today.'
        required: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refresh
        env:
          NHL_ACTIONS_TOKEN: ${{ secrets.NHL_ACTIONS_TOKEN }}
        run: |
          set -e
          DATE="${{ github.event.inputs.date }}"
          [ -z "$DATE" ] && DATE=$(TZ=America/New_York date +%F)
          if [ "$(date -u +%H)" = "04" ] && [ -z "${{ github.event.inputs.date }}" ]; then DATE=$(TZ=America/New_York date -d 'yesterday' +%F); fi
          FORCE=""; [ "${{ github.event_name }}" = "workflow_dispatch" ] && FORCE="&force=1"
          echo "Refreshing the NFL week of $DATE"
          call() { local c; for attempt in 1 2; do c=$(curl -sS -o "$2" -w '%{http_code}' -X POST --max-time 280 ${NHL_ACTIONS_TOKEN:+-H "Authorization: Bearer $NHL_ACTIONS_TOKEN"} "$1" || true); [ -n "$c" ] || c=000; case "$c" in 5*|000) [ "$attempt" = 1 ] && { echo "server answered $c; retrying in 60 s" >&2; sleep 60; } ;; *) break ;; esac; done; echo "$c"; }
          code=$(call "https://ideareels.io/api/nfl/refresh?date=$DATE&only=schedule" sched.json); echo "schedule: $code $(head -c 600 sched.json)"
          [ "$code" = "200" ] || [ "$code" = "429" ]
          if [ -n "$NHL_ACTIONS_TOKEN" ] && [ "$(date -u +%H)" != "04" ]; then
            pf=$(call "https://ideareels.io/api/nfl/refresh?date=$DATE&only=propfinder${FORCE}" pf.json); echo "propfinder: $pf $(head -c 16000 pf.json)"
          fi
