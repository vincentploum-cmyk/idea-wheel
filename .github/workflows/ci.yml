name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder

  smoke:
    name: Post-deploy smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 12
    steps:
      - name: Wait for Render to serve this commit
        run: |
          want=$(echo "${GITHUB_SHA}" | head -c 12)
          for i in $(seq 1 40); do
            live=$(curl -s https://ideareels.io/api/health | grep -oE '"commit":"[a-f0-9]+' | cut -d'"' -f4)
            echo "attempt $i: live=$live want=$want"
            [ "$live" = "$want" ] && exit 0
            sleep 15
          done
          echo "deploy did not catch up in time"; exit 1
      - name: Smoke public paths
        run: |
          set -e
          check() { code=$(curl -s -o /dev/null -w '%{http_code}' "https://ideareels.io$1"); echo "$1 -> $code"; [ "$code" = "$2" ]; }
          check / 200
          check /auth/login 200
          check /api/health 200
          check /api/nhl/runs 401
