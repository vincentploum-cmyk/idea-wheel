name: NFL PropFinder export (audit)

# The stored NFL weeks as the site holds them — the PropFinder pull, the cheat sheets, the schedule, the teams' published
# rows — gzipped per week into one artifact (kept two days), for the backtest on real PropFinder data
# (tools/audit/nfl-audit.mjs --pf; Vincent, 2026-11-01: "Backtest it with the real PropFinder data"). Read-only: the
# token-gated GET /api/nfl/propfinder?export=1. Run by hand; the artifact is downloaded into the audit's folder.
on:
  workflow_dispatch:
    inputs:
      season:
        description: 'The season (start year). Blank = this season.'
        required: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Export the stored weeks
        env:
          NHL_ACTIONS_TOKEN: ${{ secrets.NHL_ACTIONS_TOKEN }}
        run: |
          set -e
          SEASON="${{ github.event.inputs.season }}"
          mkdir -p out
          auth=(-H "Authorization: Bearer $NHL_ACTIONS_TOKEN")
          curl -sS --fail-with-body --max-time 60 "${auth[@]}" "https://ideareels.io/api/nfl/propfinder?weeks=1${SEASON:+&season=$SEASON}" -o out/weeks.json
          cat out/weeks.json; echo
          SEASON=$(jq -r .season out/weeks.json)
          for w in $(jq -r '.weeks[]' out/weeks.json); do
            case "$w" in w*) week=$((10#${w#w})); type=2 ;; p*) week=${w#p}; type=3 ;; *) continue ;; esac
            code=$(curl -sS --max-time 280 "${auth[@]}" -o "out/$w.json.gz" -w '%{http_code}' "https://ideareels.io/api/nfl/propfinder?export=1&season=$SEASON&week=$week&type=$type" || echo 000)
            if [ "$code" != "200" ]; then echo "$w: $code $(head -c 300 "out/$w.json.gz")"; rm -f "out/$w.json.gz"; continue; fi
            echo "$w: $(du -h "out/$w.json.gz" | cut -f1) · $(gunzip -c "out/$w.json.gz" | jq -c '{pullAt: .pull.at, players: (.pull.data.players | length), sheets: (.sheets | length), games: (.schedule.games | length), extraTeams: ((.extraTeams // {}) | keys | length)}')"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: nfl-pf-export
          path: out/
          retention-days: 2
