name: NHL lineups (pre-game)

# Every hour through the game day, re-read the lines for games starting within
# the next 150 minutes: the beat writers' tweets on GameDayTweets and NHL.com's
# projected lineup. The newest wins, the last capture before puck drop is frozen.
# GitHub often runs schedules late, so this is its own workflow: a delayed run
# still does only this, never the daily results pull in nhl-data.yml.
on:
  schedule:
    # Twice an hour at uncrowded minutes: GitHub skips or delays schedules at busy
    # minutes (:00, :05), and a dropped run must not cost a whole hour of lines.
    - cron: '23,53 16-23,0-3 * * *'  # 12:23–23:53 ET
  workflow_dispatch:
    inputs:
      due:
        description: 'Only games starting within this many minutes (blank = all games today)'
        required: false

jobs:
  lineups:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Beat writers' lines from GameDayTweets (fetched here, parsed by the site)
        continue-on-error: true
        env:
          NHL_ACTIONS_TOKEN: ${{ secrets.NHL_ACTIONS_TOKEN }}
        run: tools/gdt-pages.sh "$(TZ=America/New_York date +%F)"
      - name: Refresh lineups
        run: |
          set -e
          DATE=$(TZ=America/New_York date +%F)
          DUE="${{ github.event.inputs.due }}"
          [ -z "$DUE" ] && [ "${{ github.event_name }}" = "schedule" ] && DUE=150
          Q="date=$DATE&only=lineups"; [ -n "$DUE" ] && Q="$Q&due=$DUE"
          echo "Lineups for $Q"
          # A 5xx is usually the server restarting for a deploy: one more try after a minute.
          for attempt in 1 2; do
            code=$(curl -sS -o resp.json -w '%{http_code}' -X POST --max-time 280 "https://ideareels.io/api/nhl/data/refresh?$Q" || echo 000)
            head -c 3000 resp.json; echo
            case "$code" in 5*|000) [ "$attempt" = 1 ] && { echo "server answered $code; retrying in 60 s"; sleep 60; } ;; *) break ;; esac
          done
          [ "$code" = "200" ] || [ "$code" = "429" ]
