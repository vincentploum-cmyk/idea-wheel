name: NHL data refresh

# Pulls finished games (box scores + play-by-play) and NHL.com projected
# lineups into Supabase so the model's inputs build themselves.
on:
  schedule:
    - cron: '0 13 * * *'   # ~9:00 ET  yesterday's results + morning lineups
    - cron: '30 4 * * *'   # ~00:30 ET late finals
    # Hourly pre-game lineup reads live in nhl-lineups.yml.
  workflow_dispatch:
    inputs:
      date:
        description: 'Slate date (YYYY-MM-DD, ET). Blank = today.'
        required: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Beat writers' lines from GameDayTweets (fetched here, parsed by the site)
        env:
          NHL_ACTIONS_TOKEN: ${{ secrets.NHL_ACTIONS_TOKEN }}
        run: |
          DATE="${{ github.event.inputs.date }}"
          [ -z "$DATE" ] && DATE=$(TZ=America/New_York date +%F)
          tools/gdt-pages.sh "$DATE"
      - name: Refresh
        run: |
          set -e
          DATE="${{ github.event.inputs.date }}"
          [ -z "$DATE" ] && DATE=$(TZ=America/New_York date +%F)
          # The late run belongs to the previous ET day.
          if [ "$(date -u +%H)" = "04" ] && [ -z "${{ github.event.inputs.date }}" ]; then DATE=$(TZ=America/New_York date -d 'yesterday' +%F); fi
          echo "Refreshing $DATE"
          # PropFinder first, as its own request: the pull and the model run each need most of the instance's memory.
          pf=$(curl -sS -o pf.json -w '%{http_code}' -X POST --max-time 280 "https://ideareels.io/api/nhl/data/refresh?date=$DATE&only=propfinder"); echo "propfinder: $pf $(head -c 400 pf.json)"
          code=$(curl -sS -o resp.json -w '%{http_code}' -X POST --max-time 280 "https://ideareels.io/api/nhl/data/refresh?date=$DATE")
          cat resp.json; echo
          [ "$code" = "200" ] || [ "$code" = "429" ]
