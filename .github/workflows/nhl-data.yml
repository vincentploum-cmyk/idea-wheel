name: NHL data refresh

# Pulls finished games (box scores + play-by-play) and NHL.com projected
# lineups into Supabase so the model's inputs build themselves.
on:
  schedule:
    # Uncrowded minutes: GitHub delays schedules at :00 by hours on busy days.
    - cron: '17 13 * * *'  # ~9:17 ET  yesterday's results + morning lineups
    - cron: '41 4 * * *'   # ~00:41 ET late finals
    # Hourly pre-game lineup reads live in nhl-lineups.yml.
  workflow_dispatch:
    inputs:
      date:
        description: 'Slate date (YYYY-MM-DD, ET). Blank = today.'
        required: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Beat writers' lines from GameDayTweets (fetched here, parsed by the site)
        continue-on-error: true
        env:
          NHL_ACTIONS_TOKEN: ${{ secrets.NHL_ACTIONS_TOKEN }}
        run: |
          DATE="${{ github.event.inputs.date }}"
          [ -z "$DATE" ] && DATE=$(TZ=America/New_York date +%F)
          tools/gdt-pages.sh "$DATE"
      - name: Refresh
        run: |
          set -e
          DATE="${{ github.event.inputs.date }}"
          [ -z "$DATE" ] && DATE=$(TZ=America/New_York date +%F)
          # The late run belongs to the previous ET day.
          if [ "$(date -u +%H)" = "04" ] && [ -z "${{ github.event.inputs.date }}" ]; then DATE=$(TZ=America/New_York date -d 'yesterday' +%F); fi
          echo "Refreshing $DATE"
          # A 5xx is usually the server restarting for a deploy: one more try after a minute.
          call() { local c; for attempt in 1 2; do c=$(curl -sS -o "$2" -w '%{http_code}' -X POST --max-time 280 "$1" || echo 000); case "$c" in 5*|000) [ "$attempt" = 1 ] && { echo "server answered $c; retrying in 60 s"; sleep 60; } ;; *) break ;; esac; done; echo "$c"; }
          # PropFinder first, as its own request: the pull and the model run each need most of the instance's memory.
          pf=$(call "https://ideareels.io/api/nhl/data/refresh?date=$DATE&only=propfinder" pf.json); echo "propfinder: $pf $(head -c 400 pf.json)"
          code=$(call "https://ideareels.io/api/nhl/data/refresh?date=$DATE" resp.json)
          head -c 4000 resp.json; echo
          [ "$code" = "200" ] || [ "$code" = "429" ]
