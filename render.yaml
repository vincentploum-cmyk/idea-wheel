services:
  - type: web
    name: idea-wheel
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Node's heap ceiling is set in the start script (package.json): on a 512 MB
      # instance Node defaults to ~272 MB; on the 2 GB Standard instance the cap is 1536 MB.

      # Supabase — auth (magic link / Google / GitHub) + Storage for model runs.
      # The private "nhl-model" bucket is created automatically on first save.
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # Canonical site URL used for auth redirects.
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false

    # Optional overrides (safe defaults in code):
    #   NHL_ADMIN_EMAILS  comma-separated allow-list (default vincentploum@gmail.com)
    #   NHL_MODEL_BUCKET  storage bucket name (default nhl-model)
    # Optional PropFinder account, for pulling the matchup workbooks and stats tables
    # from its API instead of uploading the exports (set both in the Render dashboard):
    #   PROPFINDER_EMAIL / PROPFINDER_PASSWORD
    # Token the GitHub Actions workflows send when posting GameDayTweets pages
    # (any random string of 20+ characters; the same value is the repo secret):
    #   NHL_ACTIONS_TOKEN
