services:
  - type: web
    name: idea-wheel
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production

      # Supabase — auth (magic link / Google / GitHub) + Storage for model runs.
      # The private "nhl-model" bucket is created automatically on first save.
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # Canonical site URL used for auth redirects.
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false

    # Optional overrides (safe defaults in code):
    #   NHL_ADMIN_EMAILS  comma-separated allow-list (default vincentploum@gmail.com)
    #   NHL_MODEL_BUCKET  storage bucket name (default nhl-model)
